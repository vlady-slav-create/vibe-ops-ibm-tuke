# sniff-lab: continuous local capture and offline ZAP; optional AWS publisher.
#   server    - Campus Demo portal (HTTP :8080 and HTTPS :8443), NOT exposed to the host
#   mitmproxy - "attacker in the middle": sits in front of the server and shows everything that passes;
#               native HAR stays local; optional legacy addon export is disabled
#
# You (as the student) open the portal through mitmproxy:
#   http://localhost:8082   - HTTP, the password is visible in clear text (on the attacker screen)
#   https://localhost:8083  - HTTPS with a forged certificate (the browser will warn)
# Attacker screen: http://localhost:8081/?token=demo

services:
  storage:
    image: python:3.12-alpine
    network_mode: none
    command:
      - python
      - -c
      - "import os; [(os.chown(p, 1000, 1000), os.chmod(p, 0o700)) for p in ['/capture', '/events']]"
    volumes:
      - capture:/capture
      - events:/events

  server:
    build: ./server
    command: ["sh", "-c", "sh /certs/make-certs.sh && exec python /app/server.py"]
    volumes:
      - ./server:/app:ro
      - ./certs:/certs
    networks: [lab]

  mitmproxy:
    image: mitmproxy/mitmproxy
    user: "1000:1000"
    entrypoint: ["mitmweb"]
    # --ssl-insecure: mitmproxy does not verify the real server's self-signed certificate (demo only).
    command: >-
      --web-host 0.0.0.0 --web-port 8081
      --mode reverse:http://server:8080@8082
      --mode reverse:https://server:8443@8083
      --ssl-insecure --set web_password=demo
      --set web_open_browser=false
      -s /addon/send.py
      -s /addon/snapshot.py
    environment:
      HOME: /home/mitmproxy
      # Optional legacy export requires an explicitly configured external endpoint.
      ENDPOINT_URL: "${ENDPOINT_URL:-}"
      ENDPOINT_TOKEN: "${ENDPOINT_TOKEN:-}"
      # Only affects opt-in legacy event export, never raw local HAR.
      # 0: no masking, local-only demo (REDACT_SECRETS=0 docker compose up -d).
      REDACT_SECRETS: "${REDACT_SECRETS:-1}"
      # Default: keep exchanges local; only sanitized ZAP events reach publisher.
      EXPORT_EVENTS: "${EXPORT_EVENTS:-0}"
      SCAN_INTERVAL: "${SCAN_INTERVAL:-60}"
      CAPTURE_MAX_FLOWS: "${CAPTURE_MAX_FLOWS:-1000}"
    volumes:
      - ./addon:/addon:ro
      - capture:/capture
    ports:
      - "127.0.0.1:8081:8081"   # attacker screen (mitmweb), local only
      - "127.0.0.1:8082:8082"   # portal over HTTP
      - "127.0.0.1:8083:8083"   # portal over HTTPS
    networks: [lab]
    depends_on:
      server:
        condition: service_started
      storage:
        condition: service_completed_successfully

  zap:
    image: ghcr.io/zaproxy/zaproxy:2.17.0
    user: "1000:1000"
    init: true
    network_mode: none
    healthcheck:
      disable: true
    environment:
      EXPORT_PRIVATE_DIR: /zap/wrk
    volumes:
      - ./zap/plan.yaml:/zap/plan.yaml:ro
      - ./zap:/pipeline:ro
      - capture:/zap/wrk
      - events:/events
    command: ["python3", "/pipeline/scan.py"]
    depends_on:
      storage:
        condition: service_completed_successfully

  publisher:
    profiles: [aws]
    image: amazon/aws-cli:latest
    entrypoint: ["/bin/sh", "/publish.sh"]
    environment:
      AWS_REGION: "${AWS_REGION:-eu-central-1}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      AWS_EC2_METADATA_DISABLED: "true"
      KINESIS_STREAM_NAME: "${KINESIS_STREAM_NAME:-}"
      AWS_PAGER: ""
    volumes:
      - ./zap/publish.sh:/publish.sh:ro
      - events:/events
    depends_on:
      storage:
        condition: service_completed_successfully

networks:
  lab:

volumes:
  capture:
  events:
